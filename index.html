<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>観音珈琲 抽出レシピ</title>

<style>
body{
  font-family:-apple-system,system-ui;
  margin:18px;
  line-height:1.5;
  background:#fafafa;
}
h1{font-size:22px;margin-bottom:8px;}
.card{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
}
.time{
  font-size:44px;
  font-weight:800;
}
.sticky{
  position:sticky;
  top:0;
  background:white;
  z-index:10;
}
select,button{
  font-size:16px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}
table{
  width:100%;
  border-collapse:collapse;
}
td{
  padding:8px 0;
  border-bottom:1px solid #eee;
}
.muted{color:#666;font-size:13px;}
</style>
</head>

<body>

<h1>観音珈琲 抽出レシピ</h1>

<div class="card sticky">
  <div class="time" id="clock">00:00.0</div>
  <div id="next" class="muted">次：—</div>
  <div style="margin-top:10px;">
    <button onclick="start()">開始</button>
    <button onclick="pause()">停止</button>
    <button onclick="reset()">リセット</button>
  </div>
</div>

<div class="card">
  <select id="recipeSelect" onchange="changeRecipe()"></select>
  <div id="meta" class="muted" style="margin-top:6px;"></div>
</div>

<div class="card">
  <table>
    <tbody id="events"></tbody>
  </table>
</div>

<script>

let recipes=[];
let current=null;

let running=false,startTime=0,base=0;

function fmt(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const d=Math.floor((ms%1000)/100);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
}

function loadRecipes(){
  fetch("recipes.json")
  .then(r=>r.json())
  .then(data=>{
    recipes=data;
    const sel=document.getElementById("recipeSelect");
    data.forEach((r,i)=>{
      const opt=document.createElement("option");
      opt.value=i;
      opt.textContent=r.name;
      sel.appendChild(opt);
    });
    current=data[0];
    renderMeta();
    renderEvents();
  })
  .catch(err=>{
    alert("recipes.json が読み込めません");
  });
}

function renderMeta(){
  document.getElementById("meta").innerHTML=
    "湯温："+current.initialTemperature+"℃<br>"+current.notes;
}

function renderEvents(){
  const tbody=document.getElementById("events");
  tbody.innerHTML="";
  current.points.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=
      "<td>"+fmt(p.time*1000)+"</td>"+
      "<td>"+p.note+"</td>";
    tbody.appendChild(tr);
  });
}

function changeRecipe(){
  const i=document.getElementById("recipeSelect").value;
  current=recipes[i];
  reset();
  renderMeta();
  renderEvents();
}

function start(){
  if(!running){
    running=true;
    startTime=performance.now();
    requestAnimationFrame(tick);
  }
}

function pause(){
  if(running){
    base+=performance.now()-startTime;
    running=false;
  }
}

function reset(){
  running=false;
  base=0;
  document.getElementById("clock").textContent="00:00.0";
  document.getElementById("next").textContent="次：—";
}

function tick(){
  if(!running)return;
  const elapsed=base+(performance.now()-startTime);
  document.getElementById("clock").textContent=fmt(elapsed);

  let nextEvent=null;
  for(let p of current.points){
    if(elapsed < p.time*1000){
      nextEvent=p;
      break;
    }
  }

  document.getElementById("next").textContent=
    nextEvent ? "次："+fmt(nextEvent.time*1000)+" "+nextEvent.note : "抽出終了";

  requestAnimationFrame(tick);
}

loadRecipes();

</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>観音珈琲 抽出ナビ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a5a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">
  
<style>
:root{
  --bg:#f6f4f1;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b6b6b;
  --line:#ece7df;
  --accent:#7a5a2a;
  --accent2:#b0893f;
  --shadow:0 6px 20px rgba(0,0,0,0.08);
}
*{ box-sizing:border-box; }
body{
  font-family:-apple-system,system-ui;
  margin:18px;
  background:var(--bg);
  color:var(--text);
}
.logo{
  width: 100%;
  max-width: 340px;
  display:block;
  margin: 0 auto 6px;
}  
.header{ margin:6px 0 14px; }
.brand{ font-size:22px; font-weight:900; letter-spacing:0.02em; }
.tagline{ margin-top:4px; color:var(--muted); font-size:13px; }

.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  border:1px solid rgba(0,0,0,0.04);
}
.sticky{
  position:sticky;
  top:10px;
  z-index:10;
}
.timeRow{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}
.time{
  font-size:46px;
  font-weight:900;
  letter-spacing:0.02em;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  border:1px solid var(--line);
  color:var(--muted);
  background:#fff;
  white-space:nowrap;
}
.badge.featured{
  border-color:rgba(176,137,63,0.35);
  background:rgba(176,137,63,0.12);
  color:#6a4c1b;
}
.badge.on{
  border-color:rgba(122,90,42,0.35);
  background:rgba(122,90,42,0.10);
  color:#5c3f16;
}
.next{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
}
.next b{ color:var(--text); }

.controls{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}
button{
  font-size:16px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
}
button.primary{
  border-color:rgba(122,90,42,0.35);
  background:rgba(122,90,42,0.10);
  font-weight:800;
}
button:active{ transform:translateY(1px); }

select{
  width:100%;
  font-size:16px;
  padding:12px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
}

/* ★追加：豆写真 */
.beanPhoto{
  width:100%;
  border-radius:12px;
  margin-bottom:10px;
  display:block;
  border:1px solid rgba(0,0,0,0.06);
}

.meta{
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(0,0,0,0.02);
  color:var(--muted);
  font-size:13px;
}
.meta b{ color:var(--text); }

table{ width:100%; border-collapse:collapse; }
td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
td.tcol{
  width:92px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
tr.active{ background:rgba(122,90,42,0.06); }
tr.active td{ font-weight:800; color:var(--text); }
tr.active td:first-child{ position:relative; }
tr.active td:first-child:before{
  content:"";
  position:absolute;
  left:-8px;
  top:0; bottom:0;
  width:4px;
  border-radius:4px;
  background:var(--accent);
}
tr.upcoming{ background:rgba(232,243,255,0.65); }

.footer{
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">
 <div class="brand">
  <img src="logo.png" alt="観音珈琲 慈" class="logo"></div>
  <div class="tagline">抽出ナビ｜観音珈琲公式レシピ</div>
</div>

<!-- タイマー（固定） -->
<div class="card sticky">
  <div class="timeRow">
    <div class="time" id="clock">00:00.0</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="badge" id="featuredBadge" style="display:none;">★ 今週の豆</div>
      <div class="badge on" id="wakeBadge" style="display:none;">画面ON</div>
    </div>
  </div>

  <div class="next" id="next">次：—</div>

  <div class="controls">
    <button class="primary" onclick="start()">開始</button>
    <button onclick="pause()">停止</button>
    <button onclick="reset()">リセット</button>
    <button onclick="toggleGuide()" id="guideBtn">音声：ON</button>
  </div>
</div>

<!-- レシピ選択 -->
<div class="card">
  <!-- ★追加：豆写真（必要最低限） -->
  <img id="beanPhoto" class="beanPhoto" alt="豆写真" style="display:none;">
  <select id="recipeSelect" onchange="changeRecipe()"></select>
  <div class="meta" id="meta"></div>
</div>

<!-- ステップ -->
<div class="card">
  <table>
    <tbody id="events"></tbody>
  </table>
</div>

<div class="footer">※ recipes.json（公式データ）を読み込みます。端末の設定（マナーモード・音量）は自動変更できません。</div>

<script>
/* ========= 設定/状態 ========= */
let recipes = [];
let current = null;

let running = false;
let startTime = 0;
let base = 0;

let guideEnabled = true;          // 音声ガイドON/OFF
let femaleVoice = null;

let lastSpokenIndex = -1;         // ステップ到達の重複防止
let lastFiveSecIndex = -1;        // 5秒前予告の重複防止
let finishedSpoken = false;       // 完了アナウンスの重複防止

const VOL_NOTICE_KEY = "kannon_brew_volume_notice_seen_v1";

/* ★追加：レシピID→豆写真（最小実装）
   - ここに増やしていけばOK
   - 画像ファイルは GitHub Pages で読める場所（同階層など）に置く
*/
const RECIPE_IMAGES = {
  "tomiofukuda-dot": "トミオフクダDryOnTree2.png"
};

/* ========= Wake Lock ========= */
let wakeLock = null;
let wakeSupported = ("wakeLock" in navigator);
const wakeBadge = document.getElementById("wakeBadge");

function setWakeBadge(on){
  if(!wakeBadge) return;
  wakeBadge.style.display = on ? "inline-flex" : "none";
}

async function enableWakeLock(){
  if(!wakeSupported) return false;
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    setWakeBadge(true);

    // 何らかの理由で解除された時にUIを戻す
    wakeLock.addEventListener("release", ()=>{
      setWakeBadge(false);
      wakeLock = null;
    });

    return true;
  }catch(e){
    // 取得できない（低電力/OS制限/権限など）
    setWakeBadge(false);
    wakeLock = null;
    return false;
  }
}

async function disableWakeLock(){
  try{
    if(wakeLock){
      await wakeLock.release();
    }
  }catch(_){}
  wakeLock = null;
  setWakeBadge(false);
}

// タブ復帰/画面復帰で再取得（タイマー動作中のみ）
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible" && running){
    await enableWakeLock();
  }
});

/* ========= 音声（SpeechSynthesis） ========= */
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();

  // “女性”表記がある場合は優先。無ければ日本語ボイスの先頭。
  femaleVoice =
    voices.find(v => v.lang.startsWith("ja") && (v.name.includes("女性") || v.name.toLowerCase().includes("female")))
    || voices.find(v => v.lang.startsWith("ja"))
    || null;
}
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speak(text){
  if(!guideEnabled) return;
  if(!("speechSynthesis" in window)) return;

  try{
    const uttr = new SpeechSynthesisUtterance(String(text || ""));
    uttr.lang = "ja-JP";
    uttr.rate = 1.0;
    uttr.pitch = 1.15; // やや高めで聞き取りやすく
    if(femaleVoice) uttr.voice = femaleVoice;
    speechSynthesis.speak(uttr);
  }catch(_){}
}

function cancelSpeech(){
  if(!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); }catch(_){}
}

/* ========= バイブ ========= */
function vibrateShort(){
  if(navigator.vibrate){
    navigator.vibrate(180);
  }
}

/* ========= 表示/ユーティリティ ========= */
function fmt(ms){
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const d = Math.floor((ms % 1000) / 100);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0") + "." + d;
}
function safeText(v){ return (v ?? "").toString(); }

/* ========= 音量注意ダイアログ（初回のみ） ========= */
function showVolumeNoticeOnce(){
  try{
    const seen = localStorage.getItem(VOL_NOTICE_KEY) === "1";
    if(seen) return;

    alert(
      "音声ガイドを使う場合は、\n" +
      "・音量を少し大きめに\n" +
      "・マナーモードの影響が出る場合があります\n" +
      "・必要ならBluetooth/イヤホン推奨\n\n" +
      "この案内は初回のみ表示します。"
    );
    localStorage.setItem(VOL_NOTICE_KEY, "1");
  }catch(_){}
}

/* ========= レシピ読み込み ========= */
function renderFeaturedBadge(){
  const badge = document.getElementById("featuredBadge");
  if(!badge) return;
  if(current && current.featured){
    badge.style.display = "inline-flex";
    badge.classList.add("featured");
  }else{
    badge.style.display = "none";
    badge.classList.remove("featured");
  }
}

function renderMeta(){
  const t = Number(current?.initialTemperature);
  const temp = Number.isFinite(t) ? `${t}℃` : "—";
  const notes = safeText(current?.notes);
  document.getElementById("meta").innerHTML =
    `湯温 <b>${temp}</b><br>${notes ? notes : "（メモなし）"}`;

  // ★追加：豆写真の出し分け（最小）
  const img = document.getElementById("beanPhoto");
  if(!img) return;

  const src = current?.id ? RECIPE_IMAGES[current.id] : null;
  if(src){
    img.src = src;
    img.style.display = "block";
  }else{
    img.style.display = "none";
  }
}

function renderEvents(){
  const tbody = document.getElementById("events");
  tbody.innerHTML = "";
  (current?.points || []).forEach((p, index)=>{
    const tr = document.createElement("tr");
    tr.dataset.index = index;
    tr.innerHTML =
      `<td class="tcol">${fmt((p.time||0)*1000)}</td>` +
      `<td>${safeText(p.note)}</td>`;
    tbody.appendChild(tr);
  });
}

function loadRecipes(){
  fetch("recipes.json")
    .then(r => r.json())
    .then(data => {
      // featured を先頭へ
      data.sort((a,b)=> (b.featured===true) - (a.featured===true));
      recipes = data;

      const sel = document.getElementById("recipeSelect");
      sel.innerHTML = "";

      data.forEach((r,i)=>{
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = r.featured ? "★ 今週の豆｜" + r.name : r.name;
        sel.appendChild(opt);
      });

      current = data[0] || null;

      // ★ URLパラメータでレシピ指定
      const params = new URLSearchParams(location.search);
      const rid = params.get("r");
      if(rid){
        const idx = recipes.findIndex(x => x.id === rid);
        if(idx >= 0){
          document.getElementById("recipeSelect").value = idx;
          current = recipes[idx];
        }
      }

      renderFeaturedBadge();
      renderMeta();
      renderEvents();
    })
    .catch(()=>{
      alert("recipes.json が読み込めません（ファイル名・配置・JSON形式を確認してください）");
    });
}

function changeRecipe(){
  const i = Number(document.getElementById("recipeSelect").value);
  current = recipes[i];
  reset();
  renderFeaturedBadge();
  renderMeta();
  renderEvents();
}

/* ========= ガイドON/OFF ========= */
function toggleGuide(){
  guideEnabled = !guideEnabled;
  document.getElementById("guideBtn").textContent = "音声：" + (guideEnabled ? "ON" : "OFF");
  if(!guideEnabled) cancelSpeech();
}

/* ========= タイマー ========= */
function start(){
  if(!current) return;

  // 初回のみ「音量注意」
  showVolumeNoticeOnce();

  if(!running){
    running = true;
    startTime = performance.now();

    // タイマー開始時にWake Lock取得
    enableWakeLock();

    requestAnimationFrame(tick);
  }
}

function pause(){
  if(running){
    base += performance.now() - startTime;
    running = false;

    // 停止時はWake Lock解除（バッテリー配慮）
    disableWakeLock();
  }
}

function reset(){
  running = false;
  base = 0;

  // 状態リセット
  lastSpokenIndex = -1;
  lastFiveSecIndex = -1;
  finishedSpoken = false;
  cancelSpeech();

  // Wake Lock解除
  disableWakeLock();

  document.getElementById("clock").textContent = "00:00.0";
  document.getElementById("next").innerHTML = "次：—";
  document.querySelectorAll("#events tr").forEach(tr => tr.classList.remove("active","upcoming"));
}

function tick(){
  if(!running) return;

  const elapsed = base + (performance.now() - startTime);
  document.getElementById("clock").textContent = fmt(elapsed);

  const pts = current?.points || [];
  const rows = Array.from(document.querySelectorAll("#events tr"));
  rows.forEach(tr => tr.classList.remove("active","upcoming"));

  // 現在ステップ（最後に到達したpoint）
  let activeIndex = -1;
  for(let i=pts.length-1;i>=0;i--){
    if(elapsed >= (pts[i].time||0)*1000){
      activeIndex = i;
      break;
    }
  }
  if(activeIndex >= 0){
    const activeRow = document.querySelector(`#events tr[data-index="${activeIndex}"]`);
    if(activeRow) activeRow.classList.add("active");

    // 到達時：音声＋バイブ（1回だけ）
    if(activeIndex !== lastSpokenIndex){
      speak(pts[activeIndex].note);
      vibrateShort();
      lastSpokenIndex = activeIndex;
    }
  }

  // 次ステップ（まだ到達していない最初）
  let nextIndex = -1;
  for(let i=0;i<pts.length;i++){
    if(elapsed < (pts[i].time||0)*1000){
      nextIndex = i;
      break;
    }
  }

  if(nextIndex >= 0){
    const nx = pts[nextIndex];
    const nextTime = (nx.time||0)*1000;

    const upcomingRow = document.querySelector(`#events tr[data-index="${nextIndex}"]`);
    if(upcomingRow) upcomingRow.classList.add("upcoming");

    // 5秒前予告：音声＋バイブ（1回だけ）
    if(nextTime - elapsed <= 5000 && nextIndex !== lastFiveSecIndex){
      speak("まもなく次の工程です");
      vibrateShort();
      lastFiveSecIndex = nextIndex;
    }

    document.getElementById("next").innerHTML =
      `次：<b>${fmt(nextTime)}</b>　${safeText(nx.note)}`;

  }else{
    document.getElementById("next").innerHTML = "抽出終了";

    // 終了時：音声＋バイブ（1回だけ）
    if(!finishedSpoken){
      speak("抽出完了です");
      vibrateShort();
      finishedSpoken = true;
    }
  }

  requestAnimationFrame(tick);
}

/* ========= 起動 ========= */
loadRecipes();
document.getElementById("guideBtn").textContent = "音声：ON";
</script>

</body>
</html>

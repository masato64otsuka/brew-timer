<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>抽出タイマー</title>
  <style>
    body{font-family:-apple-system,system-ui; margin:18px; line-height:1.45;}
    h1{font-size:22px; margin:0 0 10px;}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .card{border:1px solid #ddd; border-radius:12px; padding:12px; margin:12px 0;}
    .time{font-size:44px; font-weight:700; letter-spacing:1px;}
    button,input{font-size:16px; padding:10px 12px;}
    button{border-radius:10px; border:1px solid #bbb; background:#fff;}
    button.primary{border-color:#333;}
    input[type="text"]{min-width:160px;}
    input[type="number"]{width:120px;}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th,td{border-bottom:1px solid #eee; padding:8px 6px; text-align:left;}
    tr.next{background:#e9f7ff;}
    tr.hit{background:#fff1f1;}
    .muted{color:#666; font-size:13px;}
    .pill{display:inline-block; padding:3px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px;}
  </style>
</head>
<body>
  <h1>抽出タイマー</h1>
  <div class="muted">抽出レシピ（注湯イベント）に沿って進行し、時刻到達で合図します。</div>

  <div class="card">
    <div class="time" id="clock">00:00.0</div>
    <div class="row" style="margin-top:10px;">
      <button class="primary" id="start">開始</button>
      <button id="pause">一時停止</button>
      <button id="reset">リセット</button>
      <span class="pill" id="status">停止中</span>
    </div>
    <div class="muted" style="margin-top:8px;">
      ※ iPhoneは音が「最初のタップ操作」後に有効になりやすいです（仕様）。
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="label" type="text" placeholder="イベント名（例：蒸らし開始）" />
      <input id="mm" type="number" min="0" placeholder="分" />
      <input id="ss" type="number" min="0" max="59" placeholder="秒" />
      <button id="add">追加</button>
      <button id="clear">全削除</button>
      <button id="loadSample">V60サンプル</button>
    </div>
    <div class="muted" style="margin-top:8px;">
      例：0:00 蒸らし開始 / 0:30 2投目 / 1:00 3投目 / 2:10 ドリップ終了
    </div>

    <table>
      <thead>
        <tr><th>時刻</th><th>イベント</th><th></th></tr>
      </thead>
      <tbody id="events"></tbody>
    </table>
  </div>

<script>
  // ===== Storage =====
  const KEY = "brew_events_v1";
  function loadEvents(){
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch { return []; }
  }
  function saveEvents(ev){ localStorage.setItem(KEY, JSON.stringify(ev)); }

  // ===== Time utils =====
  function msFrom(mm, ss){
    return (Number(mm)||0)*60000 + (Number(ss)||0)*1000;
  }
  function fmt(ms){
    const t = Math.max(0, ms);
    const m = Math.floor(t/60000);
    const s = Math.floor((t%60000)/1000);
    const d = Math.floor((t%1000)/100); // 0-9
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
  }

  // ===== UI refs =====
  const clockEl = document.getElementById("clock");
  const eventsTbody = document.getElementById("events");
  const statusEl = document.getElementById("status");
  const labelEl = document.getElementById("label");
  const mmEl = document.getElementById("mm");
  const ssEl = document.getElementById("ss");

  // ===== Audio (beep) =====
  let audioCtx = null;
  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      setTimeout(()=>o.stop(), 140);
    } catch(e){}
  }
  function vibrate(){
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  }

  // ===== Timer state =====
  let running = false;
  let startPerf = 0;
  let elapsedBase = 0;
  let rafId = 0;

  let events = loadEvents(); // {t:ms, label:string, fired:boolean, hitAt?:number}

  function sortEvents(){ events.sort((a,b)=>a.t-b.t); }

  function getElapsed(){
    if(!running) return elapsedBase;
    return elapsedBase + (performance.now() - startPerf);
  }

  function resetFired(){
    events.forEach(e=>{ e.fired=false; delete e.hitAt; });
  }

  function render(){
    sortEvents();
    const now = getElapsed();
    let nextIdx = events.findIndex(e => !e.fired && e.t >= now);

    eventsTbody.innerHTML = "";
    events.forEach((e, idx)=>{
      const tr = document.createElement("tr");
      if(idx === nextIdx) tr.classList.add("next");
      if(e.hitAt && now - e.hitAt < 1200) tr.classList.add("hit");

      tr.innerHTML = `
        <td>${fmt(e.t)}</td>
        <td>${e.label}${e.fired ? ' <span class="pill">済</span>' : ''}</td>
        <td><button data-i="${idx}">削除</button></td>
      `;
      eventsTbody.appendChild(tr);
    });

    eventsTbody.querySelectorAll("button[data-i]").forEach(btn=>{
      btn.onclick = () => {
        const i = Number(btn.getAttribute("data-i"));
        events.splice(i,1);
        saveEvents(events);
        render();
      };
    });
  }

  function setStatus(text){ statusEl.textContent = text; }

  function tick(){
    const ms = getElapsed();
    clockEl.textContent = fmt(ms);

    for(const e of events){
      if(!e.fired && ms >= e.t){
        e.fired = true;
        e.hitAt = ms;
        saveEvents(events);
        vibrate();
        beep();
      }
    }

    render();
    if(running) rafId = requestAnimationFrame(tick);
  }

  // ===== Controls =====
  document.getElementById("start").onclick = async () => {
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    } else {
      try { await audioCtx.resume(); } catch(e){}
    }
    if(!running){
      running = true;
      startPerf = performance.now();
      setStatus("進行中");
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    }
  };

  document.getElementById("pause").onclick = () => {
    if(running){
      elapsedBase = getElapsed();
      running = false;
      setStatus("一時停止");
      cancelAnimationFrame(rafId);
      render();
    }
  };

  document.getElementById("reset").onclick = () => {
    running = false;
    cancelAnimationFrame(rafId);
    elapsedBase = 0;
    resetFired();
    saveEvents(events);
    clockEl.textContent = fmt(0);
    setStatus("停止中");
    render();
  };

  document.getElementById("add").onclick = () => {
    const label = (labelEl.value || "").trim();
    const t = msFrom(mmEl.value, ssEl.value);
    if(!label || t < 0) return;

    events.push({ t, label, fired:false });
    labelEl.value = "";
    mmEl.value = "";
    ssEl.value = "";
    saveEvents(events);
    render();
  };

  document.getElementById("clear").onclick = () => {
    events = [];
    saveEvents(events);
    render();
  };

  document.getElementById("loadSample").onclick = () => {
    // V60例：15g / 250g（蒸らし→分割注湯→終了の合図）
    events = [
      {t: msFrom(0,0),  label:"蒸らし開始（+40g）", fired:false},
      {t: msFrom(0,30), label:"2投目（〜120g）", fired:false},
      {t: msFrom(1,0),  label:"3投目（〜200g）", fired:false},
      {t: msFrom(1,30), label:"4投目（〜250g）", fired:false},
      {t: msFrom(2,10), label:"ドリップ終了目安", fired:false}
    ];
    saveEvents(events);
    render();
  };

  render();
</script>
</body>
</html>

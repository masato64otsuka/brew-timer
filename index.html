<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>抽出タイマー（レシピ複数＋インポート）</title>
  <style>
    body{font-family:-apple-system,system-ui; margin:18px; line-height:1.45;}
    h1{font-size:22px; margin:0 0 10px;}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .card{border:1px solid #ddd; border-radius:12px; padding:12px; margin:12px 0;}
    .time{font-size:44px; font-weight:800; letter-spacing:1px;}
    button,input,select,textarea{font-size:16px; padding:10px 12px;}
    button{border-radius:10px; border:1px solid #bbb; background:#fff;}
    button.primary{border-color:#333;}
    input[type="text"]{min-width:160px;}
    input[type="number"]{width:120px;}
    select{min-width:220px;}
    textarea{width:100%; min-height:120px; box-sizing:border-box;}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th,td{border-bottom:1px solid #eee; padding:8px 6px; text-align:left; vertical-align:top;}
    tr.next{background:#e9f7ff;}
    tr.hit{background:#fff1f1;}
    .muted{color:#666; font-size:13px;}
    .pill{display:inline-block; padding:3px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px;}
    .danger{border-color:#c00; color:#c00;}
    .ok{color:#0a0; font-weight:700;}
    .err{color:#c00; font-weight:700;}
    .meta{font-size:13px; color:#333; margin-top:8px;}
    .meta b{font-weight:800;}
  </style>
</head>
<body>
  <h1>抽出タイマー（レシピ複数＋インポート）</h1>
  <div class="muted">レシピ（豆/器具/比率）ごとに保存。CSV/JSON貼り付けで自動追加できます。</div>

  <div class="card">
    <div class="time" id="clock">00:00.0</div>
    <div class="row" style="margin-top:10px;">
      <button class="primary" id="start">開始</button>
      <button id="pause">一時停止</button>
      <button id="reset">リセット</button>
      <span class="pill" id="status">停止中</span>
    </div>
    <div class="muted" style="margin-top:8px;">
      ※ iPhoneは音が「最初のタップ操作」後に有効になりやすいです（仕様）。
    </div>
  </div>

  <div class="card">
    <div class="row">
      <select id="recipeSelect"></select>
      <button id="newRecipe">新規レシピ</button>
      <button id="renameRecipe">名前変更</button>
      <button class="danger" id="deleteRecipe">削除</button>
      <button id="loadSample">V60サンプル</button>
    </div>

    <div class="meta" id="recipeMeta"></div>

    <div class="row" style="margin-top:10px;">
      <input id="label" type="text" placeholder="イベント名（例：2投目（〜120ml））" />
      <input id="mm" type="number" min="0" placeholder="分" />
      <input id="ss" type="number" min="0" max="59" placeholder="秒" />
      <button id="add">追加</button>
      <button id="clear">このレシピを全削除</button>
    </div>

    <table>
      <thead>
        <tr><th>時刻</th><th>イベント</th><th></th></tr>
      </thead>
      <tbody id="events"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div><b>インポート（CSV / JSON）</b></div>
      <div class="muted">貼り付け→ボタン→新規レシピが追加されます</div>
    </div>

    <div class="muted" style="margin-top:8px;">
      CSVはヘッダ行あり（name, initialTemperature, notes, temperaturePointsJson）。JSONは points配列だけでもOK。
    </div>

    <textarea id="importText" placeholder="ここにCSV全文 or JSONを貼り付け"></textarea>

    <div class="row" style="margin-top:10px;">
      <button id="importCSV">CSVから追加</button>
      <button id="importJSON">JSONから追加</button>
      <button id="clearImport">クリア</button>
      <span id="importMsg" class="muted"></span>
    </div>
  </div>

<script>
  // ===== Storage schema =====
  // brew_multi_v2 = { activeId: "id", recipes: { [id]: { name, meta:{initialTemperature,notes}, events:[{t,label,fired,hitAt?}] } } }
  const STORE_KEY = "brew_multi_v2";
  const LEGACY_KEYS = ["brew_multi_v1","brew_events_v2","brew_events_v1"];

  function uid(){
    return "r_" + Math.random().toString(16).slice(2) + Date.now().toString(16);
  }

  function normalizeRecipe(r){
    if(!r.meta) r.meta = {};
    if(!Array.isArray(r.events)) r.events = [];
    return r;
  }

  function loadStore(){
    // Try current
    try{
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if(s && s.recipes && s.activeId) return s;
    }catch(e){}

    // Try older multi store
    try{
      const s1 = JSON.parse(localStorage.getItem("brew_multi_v1") || "null");
      if(s1 && s1.recipes && s1.activeId){
        // migrate -> v2 with meta
        Object.values(s1.recipes).forEach(normalizeRecipe);
        const migrated = { activeId: s1.activeId, recipes: s1.recipes };
        saveStore(migrated);
        return migrated;
      }
    }catch(e){}

    // Try legacy single-array
    let legacyEvents = null;
    for(const k of LEGACY_KEYS){
      try{
        const v = JSON.parse(localStorage.getItem(k) || "null");
        if(Array.isArray(v)) { legacyEvents = v; break; }
      }catch(e){}
    }

    const id = uid();
    const store = {
      activeId: id,
      recipes: {
        [id]: normalizeRecipe({
          name: "デフォルト",
          meta: {},
          events: Array.isArray(legacyEvents) ? legacyEvents : []
        })
      }
    };
    saveStore(store);
    return store;
  }

  function saveStore(store){
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  let store = loadStore();

  function activeRecipe(){
    return normalizeRecipe(store.recipes[store.activeId]);
  }

  // ===== Time utils =====
  function msFrom(mm, ss){
    return (Number(mm)||0)*60000 + (Number(ss)||0)*1000;
  }
  function fmt(ms){
    const t = Math.max(0, ms);
    const m = Math.floor(t/60000);
    const s = Math.floor((t%60000)/1000);
    const d = Math.floor((t%1000)/100);
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
  }

  function mmssFromSeconds(sec){
    const s = Math.max(0, Math.floor(Number(sec)||0));
    return { mm: Math.floor(s/60), ss: s%60 };
  }

  // ===== UI refs =====
  const clockEl = document.getElementById("clock");
  const eventsTbody = document.getElementById("events");
  const statusEl = document.getElementById("status");

  const recipeSelect = document.getElementById("recipeSelect");
  const recipeMetaEl = document.getElementById("recipeMeta");

  const labelEl = document.getElementById("label");
  const mmEl = document.getElementById("mm");
  const ssEl = document.getElementById("ss");

  const importTextEl = document.getElementById("importText");
  const importMsgEl = document.getElementById("importMsg");

  // ===== Audio (beep) =====
  let audioCtx = null;
  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      setTimeout(()=>o.stop(), 140);
    } catch(e){}
  }
  function vibrate(){
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  }

  // ===== Timer state =====
  let running = false;
  let startPerf = 0;
  let elapsedBase = 0;
  let rafId = 0;

  function setStatus(text){ statusEl.textContent = text; }

  function getElapsed(){
    if(!running) return elapsedBase;
    return elapsedBase + (performance.now() - startPerf);
  }

  function sortEvents(events){ events.sort((a,b)=>a.t-b.t); }

  function resetFired(events){
    events.forEach(e=>{ e.fired=false; delete e.hitAt; });
  }

  function getNext(events, now){
    sortEvents(events);
    return events.find(e => !e.fired && e.t >= now) || null;
  }

  function renderMeta(){
    const r = activeRecipe();
    const t = r.meta?.initialTemperature;
    const notes = r.meta?.notes;
    const parts = [];
    if(Number.isFinite(Number(t))) parts.push(`湯温 <b>${Number(t)}℃</b>`);
    if(notes) parts.push(`メモ：<b>${escapeHtml(String(notes))}</b>`);
    recipeMetaEl.innerHTML = parts.length ? parts.join(" / ") : `<span class="muted">（レシピメモなし）</span>`;
  }

  function render(){
    const recipe = activeRecipe();
    const events = recipe.events || [];
    sortEvents(events);

    const now = getElapsed();
    const nx = getNext(events, now);
    const nextIdx = nx ? events.indexOf(nx) : -1;

    eventsTbody.innerHTML = "";
    events.forEach((e, idx)=>{
      const tr = document.createElement("tr");
      if(idx === nextIdx) tr.classList.add("next");
      if(e.hitAt && now - e.hitAt < 1200) tr.classList.add("hit");

      tr.innerHTML = `
        <td>${fmt(e.t)}</td>
        <td>${escapeHtml(e.label)}${e.fired ? ' <span class="pill">済</span>' : ''}</td>
        <td><button data-i="${idx}">削除</button></td>
      `;
      eventsTbody.appendChild(tr);
    });

    eventsTbody.querySelectorAll("button[data-i]").forEach(btn=>{
      btn.onclick = () => {
        const i = Number(btn.getAttribute("data-i"));
        recipe.events.splice(i,1);
        saveStore(store);
        render();
      };
    });

    renderMeta();
  }

  function tick(){
    const ms = getElapsed();
    clockEl.textContent = fmt(ms);

    const recipe = activeRecipe();
    const events = recipe.events || [];

    for(const e of events){
      if(!e.fired && ms >= e.t){
        e.fired = true;
        e.hitAt = ms;
        saveStore(store);
        vibrate();
        beep();
      }
    }

    render();
    if(running) rafId = requestAnimationFrame(tick);
  }

  // ===== Recipe UI =====
  function rebuildRecipeSelect(){
    recipeSelect.innerHTML = "";
    const ids = Object.keys(store.recipes);
    ids.forEach(id=>{
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = store.recipes[id].name || id;
      recipeSelect.appendChild(opt);
    });
    recipeSelect.value = store.activeId;
  }

  function switchRecipe(id){
    running = false;
    cancelAnimationFrame(rafId);
    elapsedBase = 0;
    clockEl.textContent = fmt(0);
    setStatus("停止中");

    store.activeId = id;
    saveStore(store);
    rebuildRecipeSelect();
    render();
  }

  recipeSelect.onchange = () => switchRecipe(recipeSelect.value);

  document.getElementById("newRecipe").onclick = () => {
    const name = prompt("新しいレシピ名（例：パカマラ/15g-270ml）", "新規レシピ");
    if(!name) return;
    const id = uid();
    store.recipes[id] = normalizeRecipe({ name, meta:{}, events: [] });
    store.activeId = id;
    saveStore(store);
    rebuildRecipeSelect();
    render();
  };

  document.getElementById("renameRecipe").onclick = () => {
    const r = activeRecipe();
    const name = prompt("レシピ名を変更", r.name || "レシピ");
    if(!name) return;
    r.name = name;
    saveStore(store);
    rebuildRecipeSelect();
  };

  document.getElementById("deleteRecipe").onclick = () => {
    const ids = Object.keys(store.recipes);
    if(ids.length <= 1){
      alert("最後の1つは削除できません。");
      return;
    }
    const r = activeRecipe();
    if(!confirm(`「${r.name}」を削除しますか？`)) return;

    delete store.recipes[store.activeId];
    store.activeId = Object.keys(store.recipes)[0];
    saveStore(store);
    rebuildRecipeSelect();
    render();
  };

  // ===== Controls =====
  document.getElementById("start").onclick = async () => {
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    } else {
      try { await audioCtx.resume(); } catch(e){}
    }
    if(!running){
      running = true;
      startPerf = performance.now();
      setStatus("進行中");
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tick);
    }
  };

  document.getElementById("pause").onclick = () => {
    if(running){
      elapsedBase = getElapsed();
      running = false;
      setStatus("一時停止");
      cancelAnimationFrame(rafId);
      render();
    }
  };

  document.getElementById("reset").onclick = () => {
    running = false;
    cancelAnimationFrame(rafId);
    elapsedBase = 0;

    const r = activeRecipe();
    resetFired(r.events);

    saveStore(store);
    clockEl.textContent = fmt(0);
    setStatus("停止中");
    render();
  };

  document.getElementById("add").onclick = () => {
    const label = (labelEl.value || "").trim();
    const t = msFrom(mmEl.value, ssEl.value);
    if(!label) return;

    const r = activeRecipe();
    r.events.push({ t, label, fired:false });

    labelEl.value = "";
    mmEl.value = "";
    ssEl.value = "";
    saveStore(store);
    render();
  };

  document.getElementById("clear").onclick = () => {
    const r = activeRecipe();
    if(!confirm(`「${r.name}」のイベントを全削除しますか？`)) return;
    r.events = [];
    saveStore(store);
    render();
  };

  document.getElementById("loadSample").onclick = () => {
    const r = activeRecipe();
    r.meta = { initialTemperature: 92, notes: "V60サンプル（15g / 250ml）" };
    r.events = [
      {t: msFrom(0,0),  label:"蒸らし開始（+40ml）", fired:false},
      {t: msFrom(0,30), label:"2投目（〜120ml）",  fired:false},
      {t: msFrom(1,0),  label:"3投目（〜200ml）",  fired:false},
      {t: msFrom(1,30), label:"4投目（〜250ml）",  fired:false},
      {t: msFrom(2,10), label:"ドリップ終了目安",   fired:false}
    ];
    saveStore(store);
    render();
  };

  // ===== Import helpers =====
  function msgOk(text){ importMsgEl.className = "ok"; importMsgEl.textContent = text; }
  function msgErr(text){ importMsgEl.className = "err"; importMsgEl.textContent = text; }
  function msgMuted(text){ importMsgEl.className = "muted"; importMsgEl.textContent = text; }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  // Robust-ish CSV parser (handles quoted fields with commas/newlines)
  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      const next = text[i+1];

      if(inQuotes){
        if(ch === '"' && next === '"'){ cur += '"'; i++; continue; }
        if(ch === '"'){ inQuotes = false; continue; }
        cur += ch;
        continue;
      }

      if(ch === '"'){ inQuotes = true; continue; }
      if(ch === ","){ row.push(cur); cur=""; continue; }
      if(ch === "\n"){
        row.push(cur); cur="";
        // skip empty last line
        if(row.length>1 || (row.length===1 && row[0].trim()!=="")) rows.push(row);
        row=[]; continue;
      }
      if(ch === "\r") continue;
      cur += ch;
    }
    row.push(cur);
    if(row.length>1 || (row.length===1 && row[0].trim()!=="")) rows.push(row);
    return rows;
  }

  function extractCumulativeMl(note, lastCum){
    // Prefer 合計xxxml
    const m1 = String(note).match(/合計\s*([0-9]+)\s*m?l/i);
    if(m1) return Number(m1[1]);

    // Else: add poured xxml if present
    const m2 = String(note).match(/([0-9]+)\s*m?l/ig);
    if(m2 && m2.length){
      // take first number as pour amount, add to lastCum
      const n = Number(m2[0].match(/[0-9]+/)[0]);
      return (Number(lastCum)||0) + n;
    }
    return Number(lastCum)||0;
  }

  function pointsToEvents(points){
    // points: [{time(seconds), note, temperature, id}]
    let cum = 0;
    const events = [];
    for(const p of points){
      const sec = Number(p.time||0);
      const {mm, ss} = mmssFromSeconds(sec);

      const note = (p.note ?? "").toString().trim();
      cum = extractCumulativeMl(note, cum);

      const temp = Number(p.temperature);
      const tempTxt = Number.isFinite(temp) ? `${temp}℃` : "";

      // Label format: note + cumulative
      const cumTxt = cum > 0 ? `（〜${cum}ml）` : "";
      const label = note ? `${note}${cumTxt}${tempTxt ? " / "+tempTxt : ""}` : `イベント${cumTxt}`;

      events.push({ t: msFrom(mm, ss), label, fired:false });
    }
    return events;
  }

  function addImportedRecipe({name, initialTemperature, notes, points}){
    const id = uid();
    const recipeName = (name && String(name).trim()) ? String(name).trim() : `インポート_${new Date().toISOString().slice(0,10)}`;
    store.recipes[id] = normalizeRecipe({
      name: recipeName,
      meta: {
        initialTemperature: Number.isFinite(Number(initialTemperature)) ? Number(initialTemperature) : undefined,
        notes: notes ? String(notes) : ""
      },
      events: pointsToEvents(points)
    });
    store.activeId = id;
    saveStore(store);
    rebuildRecipeSelect();
    render();
    return recipeName;
  }

  // JSON import: accepts either points array, or object with fields
  document.getElementById("importJSON").onclick = () => {
    msgMuted("");
    const text = importTextEl.value.trim();
    if(!text){ msgErr("貼り付けが空です"); return; }

    try{
      const data = JSON.parse(text);

      // Case1: array -> points
      if(Array.isArray(data)){
        const recipeName = addImportedRecipe({ name: "JSONインポート", initialTemperature: "", notes: "", points: data });
        msgOk(`OK：レシピ「${recipeName}」を追加しました`);
        return;
      }

      // Case2: object
      const name = data.name ?? "JSONインポート";
      const initialTemperature = data.initialTemperature ?? "";
      const notes = data.notes ?? "";
      let points = data.temperaturePointsJson ?? data.points ?? data.temperaturePoints ?? null;

      if(typeof points === "string"){
        points = JSON.parse(points);
      }
      if(!Array.isArray(points)) throw new Error("points配列（temperaturePointsJson等）が見つかりません");

      const recipeName = addImportedRecipe({ name, initialTemperature, notes, points });
      msgOk(`OK：レシピ「${recipeName}」を追加しました`);
    }catch(e){
      msgErr("JSONが読めません：" + e.message);
    }
  };

  // CSV import: expects header row + 1+ data rows. Imports the first data row by default.
  document.getElementById("importCSV").onclick = () => {
    msgMuted("");
    const text = importTextEl.value.trim();
    if(!text){ msgErr("貼り付けが空です"); return; }

    try{
      const rows = parseCSV(text);
      if(rows.length < 2) throw new Error("CSVの行が足りません（ヘッダ＋データ行が必要）");

      const header = rows[0].map(h => h.trim());
      const idx = (key) => header.findIndex(h => h === key);

      const iName = idx("name");
      const iTemp = idx("initialTemperature");
      const iNotes = idx("notes");
      const iJson  = idx("temperaturePointsJson");

      if(iJson < 0) throw new Error("temperaturePointsJson列が見つかりません");

      // Import first data row
      const r0 = rows[1];
      const name = iName >= 0 ? r0[iName] : "CSVインポート";
      const initialTemperature = iTemp >= 0 ? r0[iTemp] : "";
      const notes = iNotes >= 0 ? r0[iNotes] : "";
      const jsonStr = r0[iJson];

      const points = JSON.parse(jsonStr);
      if(!Array.isArray(points)) throw new Error("temperaturePointsJson が配列ではありません");

      const recipeName = addImportedRecipe({ name, initialTemperature, notes, points });
      msgOk(`OK：レシピ「${recipeName}」を追加しました`);
    }catch(e){
      msgErr("CSVが読めません：" + e.message);
    }
  };

  document.getElementById("clearImport").onclick = () => {
    importTextEl.value = "";
    msgMuted("");
  };

  // ===== init =====
  rebuildRecipeSelect();
  render();
</script>
</body>
</html>

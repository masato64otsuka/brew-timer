<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>観音珈琲 抽出ナビ</title>

<style>
:root{
  --bg:#f6f4f1;
  --card:#ffffff;
  --text:#1e1e1e;
  --muted:#6b6b6b;
  --line:#ece7df;
  --accent:#7a5a2a;
  --accent2:#b0893f;
  --shadow:0 6px 20px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;}
body{
  font-family:-apple-system,system-ui;
  margin:18px;
  background:var(--bg);
  color:var(--text);
}
.header{margin-bottom:14px;}
.brand{font-size:22px;font-weight:900;}
.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.sticky{position:sticky;top:10px;z-index:10;}
.time{font-size:46px;font-weight:900;}
.next{margin-top:6px;color:var(--muted);}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
button{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fff;
}
button.primary{
  background:rgba(122,90,42,0.1);
  border-color:rgba(122,90,42,0.3);
}
select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
}
table{width:100%;border-collapse:collapse;}
td{padding:8px;border-bottom:1px solid var(--line);}
tr.active{background:rgba(122,90,42,0.08);font-weight:700;}
tr.upcoming{background:rgba(232,243,255,0.6);}
.badge{
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(176,137,63,0.2);
  margin-left:8px;
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">観音珈琲 抽出ナビ</div>
</div>

<div class="card sticky">
  <div class="time" id="clock">00:00.0</div>
  <div class="next" id="next">次：—</div>
  <div class="controls">
    <button class="primary" onclick="start()">開始</button>
    <button onclick="pause()">停止</button>
    <button onclick="reset()">リセット</button>
    <button onclick="toggleGuide()">音声ON/OFF</button>
  </div>
</div>

<div class="card">
  <select id="recipeSelect" onchange="changeRecipe()"></select>
  <div id="meta" style="margin-top:8px;color:#666;"></div>
</div>

<div class="card">
  <table>
    <tbody id="events"></tbody>
  </table>
</div>

<script>

let recipes=[];
let current=null;

let running=false,startTime=0,base=0;

let lastSpokenIndex=-1;
let lastFiveSecIndex=-1;
let finishedSpoken=false;
let guideEnabled=true;
let femaleVoice=null;

function loadVoices(){
  const voices=speechSynthesis.getVoices();
  femaleVoice=voices.find(v=>
    v.lang.startsWith("ja") &&
    (v.name.includes("女性") || v.name.toLowerCase().includes("female"))
  ) || voices.find(v=>v.lang.startsWith("ja"));
}
speechSynthesis.onvoiceschanged=loadVoices;

function fmt(ms){
  const m=Math.floor(ms/60000);
  const s=Math.floor((ms%60000)/1000);
  const d=Math.floor((ms%1000)/100);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
}

function speak(text){
  if(!guideEnabled) return;
  if(!('speechSynthesis' in window)) return;
  const uttr=new SpeechSynthesisUtterance(text);
  uttr.lang="ja-JP";
  uttr.pitch=1.2;
  if(femaleVoice) uttr.voice=femaleVoice;
  speechSynthesis.speak(uttr);
}

function vibrateShort(){
  if(navigator.vibrate) navigator.vibrate(200);
}

function loadRecipes(){
  fetch("recipes.json")
  .then(r=>r.json())
  .then(data=>{
    data.sort((a,b)=> (b.featured===true)-(a.featured===true));
    recipes=data;
    const sel=document.getElementById("recipeSelect");
    sel.innerHTML="";
    data.forEach((r,i)=>{
      const opt=document.createElement("option");
      opt.value=i;
      opt.textContent=r.featured?"★ 今週の豆｜"+r.name:r.name;
      sel.appendChild(opt);
    });
    current=data[0];
    renderMeta();
    renderEvents();
  });
}

function renderMeta(){
  document.getElementById("meta").innerHTML=
    "湯温："+current.initialTemperature+"℃<br>"+current.notes;
}

function renderEvents(){
  const tbody=document.getElementById("events");
  tbody.innerHTML="";
  current.points.forEach((p,i)=>{
    const tr=document.createElement("tr");
    tr.dataset.index=i;
    tr.innerHTML="<td>"+fmt(p.time*1000)+"</td><td>"+p.note+"</td>";
    tbody.appendChild(tr);
  });
}

function changeRecipe(){
  current=recipes[document.getElementById("recipeSelect").value];
  reset();
  renderMeta();
  renderEvents();
}

function start(){
  if(!running){
    running=true;
    startTime=performance.now();
    requestAnimationFrame(tick);
  }
}

function pause(){
  if(running){
    base+=performance.now()-startTime;
    running=false;
  }
}

function reset(){
  running=false;
  base=0;
  lastSpokenIndex=-1;
  lastFiveSecIndex=-1;
  finishedSpoken=false;
  speechSynthesis.cancel();
  document.getElementById("clock").textContent="00:00.0";
  document.getElementById("next").textContent="次：—";
  document.querySelectorAll("#events tr").forEach(tr=>{
    tr.classList.remove("active","upcoming");
  });
}

function toggleGuide(){
  guideEnabled=!guideEnabled;
  alert("音声ガイド "+(guideEnabled?"ON":"OFF"));
}

function tick(){
  if(!running) return;
  const elapsed=base+(performance.now()-startTime);
  document.getElementById("clock").textContent=fmt(elapsed);

  const pts=current.points;
  let activeIndex=-1;
  for(let i=pts.length-1;i>=0;i--){
    if(elapsed>=pts[i].time*1000){
      activeIndex=i;
      break;
    }
  }

  let nextIndex=-1;
  for(let i=0;i<pts.length;i++){
    if(elapsed<pts[i].time*1000){
      nextIndex=i;
      break;
    }
  }

  document.querySelectorAll("#events tr").forEach(tr=>{
    tr.classList.remove("active","upcoming");
  });

  if(activeIndex>=0){
    const row=document.querySelector(`#events tr[data-index="${activeIndex}"]`);
    if(row) row.classList.add("active");

    if(activeIndex!==lastSpokenIndex){
      speak(pts[activeIndex].note);
      vibrateShort();
      lastSpokenIndex=activeIndex;
    }
  }

  if(nextIndex>=0){
    const row=document.querySelector(`#events tr[data-index="${nextIndex}"]`);
    if(row) row.classList.add("upcoming");

    const nextTime=pts[nextIndex].time*1000;
    if(nextTime-elapsed<=5000 && nextIndex!==lastFiveSecIndex){
      speak("まもなく次の工程です");
      vibrateShort();
      lastFiveSecIndex=nextIndex;
    }

    document.getElementById("next").textContent=
      "次："+fmt(nextTime)+" "+pts[nextIndex].note;
  }else{
    document.getElementById("next").textContent="抽出終了";
    if(!finishedSpoken){
      speak("抽出完了です");
      vibrateShort();
      finishedSpoken=true;
    }
  }

  requestAnimationFrame(tick);
}

loadRecipes();
</script>
</body>
</html>
